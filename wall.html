<script>
/* Written in older JavaScript (ES5) on purpose, so iOS 9 Safari can run it. */
(function () {
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var lastGenerated = 0;
  var current = null;

  function el(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* Clock uses the iPad's own time zone setting. */
  function tick() {
    var d = new Date(), h = d.getHours(), ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    el("clock").textContent = h + ":" + pad(d.getMinutes());
    el("ampm").textContent = ap;
    el("date").textContent = DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
  }

  function setStatus(text, level) {
    var s = el("status");
    s.textContent = text;
    s.className = "status" + (level ? " " + level : "");
  }

  function showStatus() {
    if (!current) { return; }
    var mins = current.dataUpdatedAt ? Math.round((new Date().getTime() - current.dataUpdatedAt) / 60000) : null;
    if (mins === null) { setStatus("Updated " + current.asOf); return; }
    if (mins <= 90) { setStatus("Updated " + current.asOf); }
    else if (mins <= 360) { setStatus("Last update " + current.asOf + " · " + Math.floor(mins / 60) + " h ago", "warn"); }
    else { setStatus("Last update " + Math.floor(mins / 60) + " h ago · check GitHub Actions", "crit"); }
  }

  function load() {
    var x = new XMLHttpRequest();
    x.open("GET", "data/wall.json?t=" + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      if (x.status === 200) {
        try {
          var d = JSON.parse(x.responseText);
          if (d.generatedAt !== lastGenerated) {
            lastGenerated = d.generatedAt;
            el("sail").innerHTML = d.sail;
            el("snow").innerHTML = d.snow;
            el("events").innerHTML = d.events;
          }
          current = d;
          showStatus();
        } catch (e) {
          setStatus("Couldn't read the latest update", "warn");
        }
      } else {
        setStatus("Can't reach the board · retrying", "warn");
      }
    };
    x.send();
  }

  window.onerror = function (msg, src, line) {
    setStatus("Page error: " + msg + " (line " + line + ")", "crit");
  };

  tick();
  setInterval(tick, 15000);
  load();
  setInterval(load, 5 * 60 * 1000);
  setInterval(showStatus, 60 * 1000);
  /* Reload the whole page every 6 hours so page changes reach the wall. */
  setTimeout(function () { window.location.reload(); }, 6 * 60 * 60 * 1000);
})();
